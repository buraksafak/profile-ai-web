# Ubuntu VPS. Joins existing global_nginx via external shared-network.
# Do not publish host ports; global_nginx already owns :80.
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: ${FRONTEND_API_URL:-/profile-ai-api}
        VITE_BASE_PATH: ${FRONTEND_BASE_PATH:-/profile-ai-web/}
    image: profile-ai-web:prod
    container_name: profile-ai-web
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://profile-ai-app:3000}
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared-network:
    external: true
